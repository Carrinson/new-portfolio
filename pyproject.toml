[project]
name = "homebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carrinson", email = "folacarrinson@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
homebase = "homebase:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
